<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Member - Netflix AI Retention Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0b0e; }
    .brand-font { font-family: 'Bebas Neue', sans-serif; }
    .netflix-glow {
      background: radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.15) 0%, rgba(11, 11, 14, 0.98) 70%);
    }
  </style>
</head>
<body class="netflix-glow text-zinc-100 min-h-screen py-8 px-4">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between pb-6 mb-8 border-b border-zinc-800">
      <div class="flex items-center space-x-3">
        <span class="brand-font text-4xl tracking-wider text-[#E50914]">NETFLIX</span>
        <span class="text-xs font-semibold px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">Feature Registration</span>
      </div>
      <a href="{{ url_for('login') }}" class="text-xs font-medium text-zinc-400 hover:text-white transition">
        ← Back to Login
      </a>
    </div>

    <!-- Register Form Card -->
    <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-8 backdrop-blur-xl shadow-2xl">
      <div class="mb-8">
        <h1 class="text-2xl font-bold text-white">Register Subscriber Profile</h1>
        <p class="text-xs text-zinc-400 mt-1">Input user usage attributes to generate instant churn score, cluster persona, and personalized retention discount offer.</p>
      </div>

      <form method="POST" action="{{ url_for('register') }}" class="space-y-6">
        
        <!-- SECTION 1: Credentials & Core Info -->
        <div>
          <h2 class="text-xs font-semibold uppercase tracking-wider text-red-500 mb-3">1. Account Credentials & Demographics</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Subscriber Full Name</label>
              <input type="text" name="name" required placeholder="e.g. Priya Sharma" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Work/Personal Email</label>
              <input type="email" name="email" required placeholder="priya@example.com" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Password</label>
              <input type="password" name="password" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Age</label>
              <input type="number" name="age" value="28" min="15" max="90" required class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Gender</label>
              <select name="gender" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
                <option value="Female">Female</option>
                <option value="Male">Male</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Region</label>
              <select name="region" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
                <option value="West India">West India</option>
                <option value="South India">South India</option>
                <option value="North India">North India</option>
                <option value="East India">East India</option>
                <option value="Central India">Central India</option>
              </select>
            </div>
          </div>
        </div>

        <!-- SECTION 2: Subscription & Financials -->
        <div class="pt-4 border-t border-zinc-800">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-red-500 mb-3">2. Plan & Financials</h2>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Subscription Tier</label>
              <select name="subscription_type" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
                <option value="Basic">Basic (₹199)</option>
                <option value="Standard" selected>Standard (₹499)</option>
                <option value="Premium">Premium (₹649)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Monthly Charges (₹)</label>
              <input type="number" step="0.01" name="monthly_charges" value="499.00" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Tenure (Months)</label>
              <input type="number" name="tenure_months" value="14" min="0" max="120" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Payment Method</label>
              <select name="payment_method" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
                <option value="UPI" selected>UPI</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Net Banking">Net Banking</option>
                <option value="Gift Card">Gift Card</option>
              </select>
            </div>
          </div>
        </div>

        <!-- SECTION 3: Engagement & Behavioral Signals -->
        <div class="pt-4 border-t border-zinc-800">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-red-500 mb-3">3. Behavioral Telemetry & Platform Usage</h2>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Avg Watch Hours/Week</label>
              <input type="number" step="0.1" name="avg_watch_hours_per_week" value="14.5" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Days Since Last Login</label>
              <input type="number" name="last_login_days" value="3" min="0" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Support Tickets Raised</label>
              <input type="number" name="support_tickets_raised" value="0" min="0" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Preferred Genre</label>
              <select name="genre_preference" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
                <option value="Action" selected>Action</option>
                <option value="Thriller">Thriller</option>
                <option value="Drama">Drama</option>
                <option value="Comedy">Comedy</option>
                <option value="Romance">Romance</option>
                <option value="Documentary">Documentary</option>
                <option value="Kids">Kids</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Primary Device</label>
              <select name="device" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
                <option value="Smart TV" selected>Smart TV</option>
                <option value="Mobile">Mobile</option>
                <option value="Laptop">Laptop</option>
                <option value="Tablet">Tablet</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Active Device Count</label>
              <input type="number" name="num_devices_active" value="3" min="1" max="10" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Account Profiles</label>
              <input type="number" name="number_of_profiles" value="3" min="1" max="5" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Autopay Enabled?</label>
              <select name="autopay_enabled" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
                <option value="1" selected>Yes (Active)</option>
                <option value="0">No (Manual)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Kids Profile Present?</label>
              <select name="has_kids_profile" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
                <option value="0" selected>No</option>
                <option value="1">Yes</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Past Discount Used?</label>
              <select name="discount_used" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:border-[#E50914] focus:outline-none">
                <option value="0" selected>No</option>
                <option value="1">Yes</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-[#E50914] hover:bg-red-700 text-white font-medium text-sm rounded-lg transition shadow-xl shadow-red-950/40">
          Save Profile & Generate Machine Learning Prediction
        </button>
      </form>
    </div>
  </div>
</body>
</html>
